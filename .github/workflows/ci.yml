name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Verify installed version matches pyproject.toml
        run: |
          uv run python - <<'PY'
          import re
          import sys
          from importlib.metadata import version
          from pathlib import Path

          text = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          if match is None:
              print("Could not find project version in pyproject.toml", file=sys.stderr)
              sys.exit(1)
          expected = match.group(1)
          installed = version("oma-python")
          if installed != expected:
              print(
                  f"Installed version {installed!r} does not match "
                  f"project.version {expected!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"Installed version {installed} matches project.version")
          PY

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest
