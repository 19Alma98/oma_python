name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Verify tag and installed version match project.version
        run: |
          uv run python - <<'PY'
          import os
          import re
          import sys
          from importlib.metadata import version as installed_version
          from pathlib import Path

          text = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          if match is None:
              print("Could not find project version in pyproject.toml", file=sys.stderr)
              sys.exit(1)
          project_version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          expected_tag = f"v{project_version}"
          if tag != expected_tag:
              print(
                  f"Tag {tag!r} does not match project.version {project_version!r} "
                  f"(expected {expected_tag!r})",
                  file=sys.stderr,
              )
              sys.exit(1)
          installed = installed_version("oma-python")
          if installed != project_version:
              print(
                  f"Installed version {installed!r} does not match "
                  f"project.version {project_version!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(
              f"Tag {tag} and installed version {installed} "
              f"match project.version {project_version}"
          )
          PY

  publish:
    needs: [lint, test, version-check]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
