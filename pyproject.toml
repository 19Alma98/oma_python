[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oma-python"
version = "0.1.0"
description = "Operational Modal Analysis (OMA) algorithms for structural dynamics: FDD and Covariance SSI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "19Alma98" },
]
keywords = [
    "oma",
    "operational-modal-analysis",
    "structural-dynamics",
    "modal-identification",
    "fdd",
    "ssi",
    "vibration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.11.7",
    "scipy>=1.15.3",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/19Alma98/oma_python"
Repository = "https://github.com/19Alma98/oma_python"
Issues = "https://github.com/19Alma98/oma_python/issues"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.0",
    "scipy-stubs>=1.15.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.0",
    "scipy-stubs>=1.15.3.0",
]

[tool.setuptools.packages.find]
include = ["dynoma*"]

[tool.setuptools.package-data]
dynoma = ["py.typed"]

# Default to CPU-only PyTorch wheels (lighter, no CUDA system libs required).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["dynoma"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["dynoma"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
packages = ["dynoma"]
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
